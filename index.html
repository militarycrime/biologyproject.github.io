<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D модель</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; background: #eef1f6; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #loader {
    position: fixed; inset: 0; z-index: 20; background: #eef1f6;
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
    transition: opacity .5s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 52px; height: 52px; border-radius: 50%;
    border: 4px solid #c9d4e5; border-top-color: #1f9d55;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { color: #5a6b82; font-size: 15px; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
    border: 1px solid #d5dce7; border-radius: 999px;
    padding: 10px 22px; font-size: 14px; color: #3d4c61; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(60,80,110,.12);
  }
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div><p>Загрузка модели...</p></div>
<div id="hint">Крути пальцем или мышью</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const loaderEl = document.getElementById('loader');
const loaderText = loaderEl.querySelector('p');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f6);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 2.2, 4.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 15;
controls.target.set(0, 0.8, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 2.0;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb9c4d6, 1.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd6e6ff, 0.9);
fill.position.set(-4, 3, -4);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.ShadowMaterial({ opacity: 0.18 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(18, 36, 0xb9c4d4, 0xd3dbe7);
grid.position.y = 0.002;
scene.add(grid);

const root = new THREE.Group();
scene.add(root);

new GLTFLoader().load(
  new URL('model.glb', document.baseURI).href,
  (gltf) => {
    const model = gltf.scene;
    model.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
      }
    });
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    root.add(model);
    const s = 2.6 / Math.max(size.x, size.y, size.z);
    root.scale.setScalar(s);
    root.position.y = (size.y * s) / 2;
    loaderEl.classList.add('hidden');
  },
  (xhr) => {
    if (xhr.total > 0) loaderText.textContent = 'Загрузка модели... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  },
  () => {
    loaderText.textContent = 'Не удалось загрузить model.glb — проверь, что файл рядом с index.html';
    document.querySelector('#loader .spinner').style.display = 'none';
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
